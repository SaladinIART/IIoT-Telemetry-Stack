name: Demo (GitHub Pages)

# Builds the browser-only NEXUS demo (replay of recorded API output) and
# publishes it at https://salbotics.uk/IIoT-Telemetry-Stack/ (project page under
# the user site's custom domain). One-time setup: repo Settings > Pages >
# Source = "GitHub Actions".

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "tools/make_placeholder_demo_fixtures.py"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run check

      - name: Report fixture provenance
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("frontend/demo-fixtures/manifest.json"))
          print("fixture source:", m["source"], m.get("captured_at") or m.get("generated_at"))
          PY

      - name: Build demo
        working-directory: frontend
        env:
          BASE_PATH: /IIoT-Telemetry-Stack
        run: npm run build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
